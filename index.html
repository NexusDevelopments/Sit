<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visitor Counter</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe6;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #0f766e;
        --shadow: 0 24px 60px rgba(31, 41, 55, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.15), transparent 35%),
          radial-gradient(circle at bottom right, rgba(217, 119, 6, 0.15), transparent 30%),
          var(--bg);
        color: var(--text);
        padding: 24px;
      }

      .card {
        width: min(560px, 100%);
        background: var(--card);
        border-radius: 28px;
        padding: 40px;
        box-shadow: var(--shadow);
        border: 1px solid rgba(31, 41, 55, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 6vw, 4rem);
        line-height: 1;
        letter-spacing: -0.05em;
      }

      p {
        margin: 0 0 24px;
        font-size: 1.05rem;
        line-height: 1.6;
        color: var(--muted);
      }

      .count {
        display: inline-flex;
        align-items: baseline;
        gap: 10px;
        padding: 18px 22px;
        border-radius: 20px;
        background: rgba(15, 118, 110, 0.08);
        color: var(--accent);
        font-weight: 700;
      }

      .count strong {
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        line-height: 1;
      }

      .hint {
        margin-top: 18px;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Welcome</h1>
      <p>This page keeps track of how many times it has been visited.</p>
      <div class="count" aria-live="polite">
        <strong id="visitCount">...</strong>
        <span>visits</span>
      </div>
      <p class="hint">Refresh still adds a new visit.</p>
    </main>

    <script>
      const cacheKey = 'sit-visitor-counter-cache';

      function getCachedVisits() {
        const raw = localStorage.getItem(cacheKey);
        const value = Number(raw);
        return Number.isFinite(value) && value >= 0 ? value : 0;
      }

      function setCachedVisits(value) {
        localStorage.setItem(cacheKey, String(value));
      }

      async function updateVisitCount() {
        const countEl = document.getElementById('visitCount');
        countEl.textContent = getCachedVisits();

        try {
          const response = await fetch('/api/visit');
          const data = await response.json();

          if (!response.ok || typeof data.visits !== 'number') {
            const fallback = getCachedVisits() + 1;
            setCachedVisits(fallback);
            countEl.textContent = fallback;
            return;
          }

          setCachedVisits(data.visits);
          countEl.textContent = data.visits;
        } catch {
          const fallback = getCachedVisits() + 1;
          setCachedVisits(fallback);
          countEl.textContent = fallback;
        }
      }

      updateVisitCount();
    </script>
  </body>
</html>
