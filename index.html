<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visitor Counter</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe6;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #0f766e;
        --shadow: 0 24px 60px rgba(31, 41, 55, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.15), transparent 35%),
          radial-gradient(circle at bottom right, rgba(217, 119, 6, 0.15), transparent 30%),
          var(--bg);
        color: var(--text);
        padding: 24px;
      }

      .card {
        width: min(560px, 100%);
        background: var(--card);
        border-radius: 28px;
        padding: 40px;
        box-shadow: var(--shadow);
        border: 1px solid rgba(31, 41, 55, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 6vw, 4rem);
        line-height: 1;
        letter-spacing: -0.05em;
      }

      p {
        margin: 0 0 24px;
        font-size: 1.05rem;
        line-height: 1.6;
        color: var(--muted);
      }

      .count {
        display: inline-flex;
        align-items: baseline;
        gap: 10px;
        padding: 18px 22px;
        border-radius: 20px;
        background: rgba(15, 118, 110, 0.08);
        color: var(--accent);
        font-weight: 700;
      }

      .count strong {
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        line-height: 1;
      }

      .hint {
        margin-top: 18px;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Welcome</h1>
      <p>This page tracks global visits across all users and visit types.</p>
      <div class="count" aria-live="polite">
        <strong id="visitCount">...</strong>
        <span>total visits</span>
      </div>
      <p class="hint">Counts page opens, reloads, back/forward visits, and visibility returns.</p>
      <p class="hint"><a href="/cds">Open diagnostics (/cds)</a></p>
    </main>

    <script>
      const cacheKey = 'sit-visitor-counter-cache';
      const logKey = 'sit-debug-logs';
      const uniqueKey = 'sit-unique-visitor-tracked-v1';
      const sessionVisibilityKey = 'sit-visibility-tracked';
      const countNamespace = 'nexusdevelopments-sit';

      const counterKeys = {
        total: 'total-visits',
        homepage: 'homepage-visits',
        unique: 'unique-visitors',
        navNavigate: 'nav-navigate',
        navReload: 'nav-reload',
        navBackForward: 'nav-back-forward',
        visibilityReturn: 'visibility-return',
        externalReferrer: 'external-referrer'
      };

      function countApiUrl(action, key) {
        return `https://api.countapi.xyz/${action}/${countNamespace}/${key}`;
      }

      async function countApiHit(key) {
        const response = await fetch(countApiUrl('hit', key));
        const data = await response.json();

        if (!response.ok || typeof data.value !== 'number') {
          throw new Error(`CountAPI hit failed for ${key}`);
        }

        return data.value;
      }

      async function countApiGet(key) {
        const response = await fetch(countApiUrl('get', key));
        const data = await response.json();

        if (!response.ok || typeof data.value !== 'number') {
          throw new Error(`CountAPI get failed for ${key}`);
        }

        return data.value;
      }

      function navigationType() {
        const nav = performance.getEntriesByType('navigation')[0];
        return nav && nav.type ? nav.type : 'navigate';
      }

      function pushDebug(level, event, meta) {
        const raw = localStorage.getItem(logKey);
        const logs = raw ? JSON.parse(raw) : [];

        logs.push({
          time: new Date().toISOString(),
          level,
          event,
          meta: meta || {}
        });

        if (logs.length > 200) {
          logs.shift();
        }

        localStorage.setItem(logKey, JSON.stringify(logs));
      }

      function getCachedVisits() {
        const raw = localStorage.getItem(cacheKey);
        const value = Number(raw);
        return Number.isFinite(value) && value >= 0 ? value : 0;
      }

      function setCachedVisits(value) {
        localStorage.setItem(cacheKey, String(value));
      }

      async function trackVisitForms() {
        const navType = navigationType();
        const navKey =
          navType === 'reload'
            ? counterKeys.navReload
            : navType === 'back_forward'
              ? counterKeys.navBackForward
              : counterKeys.navNavigate;

        const tasks = [
          countApiHit(counterKeys.total),
          countApiHit(counterKeys.homepage),
          countApiHit(navKey)
        ];

        if (!localStorage.getItem(uniqueKey)) {
          tasks.push(
            countApiHit(counterKeys.unique).then((value) => {
              localStorage.setItem(uniqueKey, '1');
              pushDebug('info', 'unique_visitor_tracked', { value });
              return value;
            })
          );
        }

        if (document.referrer && !document.referrer.includes(location.hostname)) {
          tasks.push(countApiHit(counterKeys.externalReferrer));
        }

        const results = await Promise.allSettled(tasks);
        return results;
      }

      async function updateVisitCount() {
        const countEl = document.getElementById('visitCount');
        const fallbackNext = getCachedVisits() + 1;
        setCachedVisits(fallbackNext);
        countEl.textContent = fallbackNext;

        try {
          const results = await trackVisitForms();
          const totalResult = results[0];

          if (totalResult && totalResult.status === 'fulfilled') {
            setCachedVisits(totalResult.value);
            countEl.textContent = totalResult.value;
            console.log('[sit] global total visits', totalResult.value);
            pushDebug('info', 'global_visit_tracked', {
              total: totalResult.value,
              navType: navigationType()
            });
          } else {
            throw new Error('Total counter did not resolve');
          }
        } catch (error) {
          console.warn('[sit] using local fallback counter', error);
          pushDebug('warn', 'global_counter_fallback', {
            fallback: fallbackNext,
            message: String(error)
          });
        }
      }

      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState !== 'visible') {
          return;
        }

        if (sessionStorage.getItem(sessionVisibilityKey)) {
          return;
        }

        sessionStorage.setItem(sessionVisibilityKey, '1');

        try {
          const value = await countApiHit(counterKeys.visibilityReturn);
          pushDebug('info', 'visibility_return_tracked', { value });
        } catch (error) {
          pushDebug('warn', 'visibility_return_failed', { message: String(error) });
        }
      });

      updateVisitCount();

      window.countApiGet = countApiGet;
      window.counterKeys = counterKeys;
    </script>
  </body>
</html>
