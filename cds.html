<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Counter Debug Screen</title>
    <style>
      :root {
        --bg: #0a0e14;
        --panel: #121926;
        --ink: #d5deea;
        --muted: #8fa0b8;
        --accent: #3b82f6;
        --ok: #22c55e;
        --warn: #f59e0b;
        --err: #ef4444;
        --console-bg: #0b111b;
        --console-fg: #d7dde8;
        --console-muted: #7f8ca1;
        --console-info: #60a5fa;
        --console-warn: #fbbf24;
        --console-error: #f87171;
        --console-border: #1b2940;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 5%, rgba(59, 130, 246, 0.18), transparent 32%),
          radial-gradient(circle at 90% 92%, rgba(16, 185, 129, 0.1), transparent 30%),
          linear-gradient(180deg, rgba(59, 130, 246, 0.07), transparent 45%),
          var(--bg);
      }

      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 28px 18px 36px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 3vw, 2rem);
      }

      .muted {
        color: var(--muted);
        margin: 4px 0 0;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.9rem;
        font-weight: 600;
        background: rgba(59, 130, 246, 0.15);
        border: 1px solid rgba(96, 165, 250, 0.35);
        color: #93c5fd;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-bottom: 14px;
      }

      .card {
        background: var(--panel);
        border: 1px solid #243248;
        border-radius: 14px;
        padding: 14px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
      }

      .label {
        color: var(--muted);
        font-size: 0.85rem;
        margin-bottom: 6px;
      }

      .value {
        font-size: 1.3rem;
        font-weight: 700;
      }

      .status-ok {
        color: var(--ok);
      }

      .status-warn {
        color: var(--warn);
      }

      .status-err {
        color: var(--err);
      }

      .toolbar {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }

      button {
        border: 1px solid #2f4770;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.92rem;
        font-weight: 600;
        cursor: pointer;
        background: #1d4ed8;
        color: #e5edff;
      }

      button.secondary {
        background: #1e293b;
        border-color: #334155;
      }

      button.ghost {
        background: transparent;
        border-color: #2d3b52;
        color: #bfdbfe;
      }

      .console {
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--console-border);
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.3);
      }

      .console-head {
        background: #111927;
        color: #dbe8ff;
        padding: 10px 12px;
        font-size: 0.86rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--console-border);
      }

      .console-actions {
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }

      .tiny {
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 0.78rem;
      }

      .console-body {
        background: var(--console-bg);
        color: var(--console-fg);
        margin: 0;
        padding: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.83rem;
        line-height: 1.45;
        max-height: 56vh;
        overflow: auto;
        white-space: pre-wrap;
      }

      .line {
        display: block;
        padding: 1px 0;
      }

      .line .ts {
        color: var(--console-muted);
      }

      .line.info .lvl {
        color: var(--console-info);
      }

      .line.warn .lvl {
        color: var(--console-warn);
      }

      .line.error .lvl {
        color: var(--console-error);
      }

      .line .event {
        color: #c7d2e5;
      }

      .line .meta {
        color: #8ea0bc;
      }

      .copy-status {
        color: #93c5fd;
        font-size: 0.78rem;
        min-width: 78px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div>
          <h1>Counter Diagnostics</h1>
          <p class="muted">Live global counters across all visit forms.</p>
        </div>
        <div class="pill" id="liveBadge">Checking status...</div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="label">Current Mode</div>
          <div class="value" id="modeValue">-</div>
        </div>
        <div class="card">
          <div class="label">Global Total Visits</div>
          <div class="value" id="visitsValue">-</div>
        </div>
        <div class="card">
          <div class="label">Unique Visitors</div>
          <div class="value" id="hitsValue">-</div>
        </div>
        <div class="card">
          <div class="label">Visit Type Summary</div>
          <div class="value" id="stateValue">-</div>
        </div>
      </div>

      <div class="toolbar">
        <button id="refreshBtn">Refresh Status</button>
        <button id="visitBtn" class="secondary">Trigger Test Visit</button>
      </div>

      <section class="console">
        <div class="console-head">
          <span>Debug Console</span>
          <div class="console-actions">
            <span id="logCount">0 lines</span>
            <button id="copyBtn" class="ghost tiny">Copy Logs</button>
            <span id="copyStatus" class="copy-status"></span>
          </div>
        </div>
        <div class="console-body" id="consoleOut"></div>
      </section>
    </div>

    <script>
      const cacheKey = 'sit-visitor-counter-cache';
      const logKey = 'sit-debug-logs';
      const countNamespace = 'nexusdevelopments-sit';

      const counterKeys = {
        total: 'total-visits',
        homepage: 'homepage-visits',
        cds: 'cds-visits',
        unique: 'unique-visitors',
        navNavigate: 'nav-navigate',
        navReload: 'nav-reload',
        navBackForward: 'nav-back-forward',
        visibilityReturn: 'visibility-return',
        externalReferrer: 'external-referrer'
      };

      const els = {
        liveBadge: document.getElementById('liveBadge'),
        modeValue: document.getElementById('modeValue'),
        visitsValue: document.getElementById('visitsValue'),
        hitsValue: document.getElementById('hitsValue'),
        stateValue: document.getElementById('stateValue'),
        consoleOut: document.getElementById('consoleOut'),
        logCount: document.getElementById('logCount'),
        copyBtn: document.getElementById('copyBtn'),
        copyStatus: document.getElementById('copyStatus')
      };

      let lastRenderedLogs = [];

      function readLogs() {
        try {
          const raw = localStorage.getItem(logKey);
          return raw ? JSON.parse(raw) : [];
        } catch {
          return [];
        }
      }

      function pushLog(level, event, meta) {
        const logs = readLogs();
        logs.push({
          time: new Date().toISOString(),
          level,
          event,
          meta: meta || {}
        });
        if (logs.length > 200) {
          logs.shift();
        }
        localStorage.setItem(logKey, JSON.stringify(logs));
      }

      function readVisits() {
        const raw = localStorage.getItem(cacheKey);
        const visits = Number(raw);
        return Number.isFinite(visits) && visits >= 0 ? visits : 0;
      }

      function countApiUrl(action, key) {
        return `https://api.countapi.xyz/${action}/${countNamespace}/${key}`;
      }

      async function countApiGet(key) {
        const response = await fetch(countApiUrl('get', key));
        const data = await response.json();
        if (!response.ok || typeof data.value !== 'number') {
          throw new Error(`CountAPI get failed for ${key}`);
        }
        return data.value;
      }

      async function countApiHit(key) {
        const response = await fetch(countApiUrl('hit', key));
        const data = await response.json();
        if (!response.ok || typeof data.value !== 'number') {
          throw new Error(`CountAPI hit failed for ${key}`);
        }
        return data.value;
      }

      function lineHtml(log) {
        const safeMeta = JSON.stringify(log.meta || {});
        return `<span class="line ${log.level}"><span class="ts">${log.time}</span> <span class="lvl">${log.level.toUpperCase()}</span> <span class="event">${log.event}</span> <span class="meta">${safeMeta}</span></span>`;
      }

      function formatLogLine(log) {
        const meta = JSON.stringify(log.meta || {});
        return `${log.time} ${String(log.level || 'info').toUpperCase()} ${log.event} ${meta}`;
      }

      function renderLogs(logs) {
        lastRenderedLogs = logs.slice();
        els.logCount.textContent = `${logs.length} lines`;
        els.consoleOut.innerHTML = logs.map(lineHtml).join('');
        els.consoleOut.scrollTop = els.consoleOut.scrollHeight;
      }

      async function copyVisibleLogs() {
        const text = lastRenderedLogs.map(formatLogLine).join('\n');
        if (!text) {
          els.copyStatus.textContent = 'Nothing to copy';
          return;
        }

        try {
          await navigator.clipboard.writeText(text);
          els.copyStatus.textContent = 'Copied';
        } catch {
          const area = document.createElement('textarea');
          area.value = text;
          area.setAttribute('readonly', '');
          area.style.position = 'absolute';
          area.style.left = '-9999px';
          document.body.appendChild(area);
          area.select();
          document.execCommand('copy');
          document.body.removeChild(area);
          els.copyStatus.textContent = 'Copied';
        }

        setTimeout(() => {
          els.copyStatus.textContent = '';
        }, 1400);
      }

      async function renderStatus() {
        const logs = readLogs();
        const hasError = logs.some((log) => log.level === 'error');
        const localVisits = readVisits();

        let total = localVisits;
        let unique = 0;
        let navNavigate = 0;
        let navReload = 0;
        let navBack = 0;

        try {
          const values = await Promise.all([
            countApiGet(counterKeys.total),
            countApiGet(counterKeys.unique),
            countApiGet(counterKeys.navNavigate),
            countApiGet(counterKeys.navReload),
            countApiGet(counterKeys.navBackForward)
          ]);

          total = values[0];
          unique = values[1];
          navNavigate = values[2];
          navReload = values[3];
          navBack = values[4];
          pushLog('info', 'status_refresh_ok', { total, unique });
        } catch (error) {
          pushLog('warn', 'status_refresh_fallback', { message: String(error) });
        }

        els.modeValue.textContent = 'global countapi + local fallback';
        els.visitsValue.textContent = String(total);
        els.hitsValue.textContent = String(unique);
        els.stateValue.textContent = `N:${navNavigate} R:${navReload} B:${navBack}`;

        if (hasError) {
          els.liveBadge.textContent = 'Warning logs found';
        } else {
          els.liveBadge.textContent = 'Healthy';
        }

        els.stateValue.className = 'value status-ok';

        renderLogs(logs.slice(-80));
      }

      async function triggerVisit() {
        try {
          const values = await Promise.all([
            countApiHit(counterKeys.total),
            countApiHit(counterKeys.cds)
          ]);
          pushLog('info', 'cds_test_visit_tracked', { total: values[0], cds: values[1] });
        } catch (error) {
          pushLog('error', 'cds_test_visit_failed', { message: String(error) });
        }

        renderStatus();
      }

      document.getElementById('refreshBtn').addEventListener('click', renderStatus);
      document.getElementById('visitBtn').addEventListener('click', triggerVisit);
      els.copyBtn.addEventListener('click', copyVisibleLogs);

      countApiHit(counterKeys.cds)
        .then((value) => pushLog('info', 'cds_page_visit', { value }))
        .catch((error) => pushLog('warn', 'cds_page_visit_failed', { message: String(error) }));

      renderStatus();
      setInterval(renderStatus, 5000);
    </script>
  </body>
</html>
